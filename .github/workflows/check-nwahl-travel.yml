name: Check NWAHL team schedule

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send a test email only to the SMTP owner
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAIL_USERNAME: ${{ secrets.NWAHL_ALERT_SMTP_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.NWAHL_ALERT_SMTP_PASSWORD }}
      MAIL_RECIPIENTS: ${{ secrets.NWAHL_ALERT_RECIPIENTS }}
      NWAHL_REPORT_PATH: nwahl-schedule-report.txt
      NWAHL_ERROR_REPORT_PATH: nwahl-check-error.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: schedule
        continue-on-error: true
        run: node scripts/check-nwahl-travel.mjs
      - id: issue
        continue-on-error: true
        if: steps.schedule.outputs.kind == 'change' || steps.schedule.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          KIND: ${{ steps.schedule.outputs.kind }}
        with:
          script: |
            const title = 'NWAHL team schedule needs review';
            const kind = process.env.KIND;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const prior = existing.find(issue => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const message = kind === 'change'
              ? `The daily comparison found a confirmed team schedule change. Review the workflow output and update the baseline after checking whether any travel details are affected: ${runUrl}`
              : `The daily schedule checker could not complete. No schedule change has been confirmed: ${runUrl}`;
            if (!prior) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body: message,
              });
            }
      - name: Email the team schedule alert
        if: ${{ !cancelled() && steps.schedule.outputs.kind == 'change' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_RECIPIENTS != '' }}
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          from: NWAHL Schedule Monitor <${{ env.MAIL_USERNAME }}>
          to: ${{ env.MAIL_RECIPIENTS }}
          subject: Seattle Junior Mets 16U AA schedule update
          body: file://nwahl-schedule-report.txt
      - name: Email Gordon if the checker fails
        if: ${{ !cancelled() && steps.schedule.outcome == 'failure' && steps.schedule.outputs.kind == 'error' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          from: NWAHL Schedule Monitor <${{ env.MAIL_USERNAME }}>
          to: ${{ env.MAIL_USERNAME }}
          subject: NWAHL schedule check could not run
          body: file://nwahl-check-error.txt
      - name: Send a test email only to Gordon
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.send_test_email && steps.schedule.outputs.kind == 'match' && env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          from: NWAHL Schedule Monitor <${{ env.MAIL_USERNAME }}>
          to: ${{ env.MAIL_USERNAME }}
          subject: NWAHL schedule monitor test
          body: |
            Hello,

            This is a test of the Seattle Junior Mets 16U AA schedule monitor. The email connection is working.

            No schedule change was detected or reported by this test.
      - if: ${{ !cancelled() && (steps.schedule.outcome == 'failure' || steps.issue.outcome == 'failure') }}
        run: |
          echo "::error::The checker or GitHub issue update failed. If the team email step succeeded, recipients were already notified; do not re-run this job because that could resend the alert. Update the issue manually instead."
          exit 1
