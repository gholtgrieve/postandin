name: Check NWAHL travel schedule

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: schedule
        continue-on-error: true
        run: node scripts/check-nwahl-travel.mjs
      - if: steps.schedule.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'NWAHL travel schedule needs review';
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const prior = existing.find(issue => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (!prior) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The daily comparison found a schedule difference or could not complete. Review the workflow output before updating the travel page: ${runUrl}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body: `The latest daily comparison also needs review: ${runUrl}`,
              });
            }
      - if: steps.schedule.outcome == 'failure'
        run: exit 1
