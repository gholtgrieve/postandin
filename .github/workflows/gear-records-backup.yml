name: Gear records backup

# Production backup. Manual dispatch remains available for controlled checks;
# the schedule was enabled after the first real backup and restore rehearsal passed.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: gear-records-backup
  cancel-in-progress: false

jobs:
  backup:
    environment: gear-backup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age=1.1.1-1ubuntu0.24.04.3
      - name: Export, encrypt, upload and read back Gear records
        env:
          GEAR_BACKUP_CF_ACCOUNT_ID: ${{ secrets.GEAR_BACKUP_CF_ACCOUNT_ID }}
          GEAR_BACKUP_D1_DATABASE_ID: ${{ secrets.GEAR_BACKUP_D1_DATABASE_ID }}
          GEAR_BACKUP_CF_API_TOKEN: ${{ secrets.GEAR_BACKUP_CF_API_TOKEN }}
          GEAR_BACKUP_B2_KEY_ID: ${{ secrets.GEAR_BACKUP_B2_KEY_ID }}
          GEAR_BACKUP_B2_APP_KEY: ${{ secrets.GEAR_BACKUP_B2_APP_KEY }}
          GEAR_BACKUP_B2_BUCKET_ID: ${{ secrets.GEAR_BACKUP_B2_BUCKET_ID }}
          GEAR_BACKUP_AGE_RECIPIENT: ${{ secrets.GEAR_BACKUP_AGE_RECIPIENT }}
        run: node scripts/gear/lean-cloud-backup.mjs
