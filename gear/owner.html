<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Local Gear owner review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/gear/owner.css">
</head>
<body>
  <main>
    <header class="page-heading">
      <p class="eyebrow">Post &amp; In · Gear Exchange</p>
      <h1 id="title">Local Gear owner review</h1>
      <p id="intro">Sample data only. Actions affect this local database. No email or production changes.</p>
    </header>
    <p id="notice" role="status" tabindex="-1"></p>
    <form id="login" class="panel">
      <label>Local owner key<input id="key" type="password" autocomplete="off" required pattern="[a-f0-9]{64}" maxlength="64"></label>
      <button class="primary">Sign in</button>
    </form>
    <section id="workspace" hidden>
      <div class="toolbar"><button id="refresh">Refresh</button><button id="logout">Quit</button></div>
      <section class="review-section" aria-labelledby="reports-heading">
        <div class="section-heading"><p class="eyebrow">Needs review</p><h2 id="reports-heading">Reports</h2></div>
        <div id="reports"></div>
      </section>
      <details id="removed-section" class="secondary-section">
        <summary>Removed listings</summary>
        <div id="removed"></div>
      </details>
      <details id="history-section" class="secondary-section">
        <summary>Action history</summary>
        <div id="history"></div>
      </details>
    </section>
  </main>
  <script type="module" src="/gear/owner.mjs"></script>
</body>
</html>
